# ============================================================
#  DynamicAPI More Placeholders
# ============================================================
#  This is an extra example file. You can create as many
#  .yml files as you want in this folder — any file with a
#  "Placeholders:" section will be loaded automatically.
# ============================================================

Placeholders:
  # ----------------------------------------------------------
  # %playerinfo_health%
  # Returns the current health of the evaluating player.
  # ----------------------------------------------------------
  player_health:
    enable: false
    prefix: 'playerinfo'
    pattern: 'health'
    requires_player: true
    context: {}
    variables:
      result: 'player.health'             # Calls player.getHealth() — returns a double (e.g. 18.0)
    returns: '{result}'
    fallback: '0'

  # ----------------------------------------------------------
  # %playerinfo_level%
  # Returns the XP level of the evaluating player.
  # ----------------------------------------------------------
  player_level:
    enable: false
    prefix: 'playerinfo'
    pattern: 'level'
    requires_player: true
    context: {}
    variables:
      result: 'player.level'              # Calls player.getLevel() — returns an int
    returns: '{result}'
    fallback: '0'

  # ----------------------------------------------------------
  # %playerinfo_food%
  # Returns the food level of the evaluating player.
  # ----------------------------------------------------------
  player_food:
    enable: false
    prefix: 'playerinfo'
    pattern: 'food'
    requires_player: true
    context: {}
    variables:
      result: 'player.foodLevel'          # Calls player.getFoodLevel() — returns an int (0-20)
    returns: '{result}'
    fallback: '0'