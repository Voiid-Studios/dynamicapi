# ============================================================
#  DynamicAPI Placeholders
# ============================================================
#  You can create multiple .yml files in this folder.
#  Any file containing a "Placeholders:" section will be
#  loaded automatically by DynamicAPI.
#
#  Reload with: /dapi reload
# ============================================================

Placeholders:
  # ----------------------------------------------------------
  # %teaminfo_size_<team>%
  # Returns the number of entries in the specified team.
  # Ex: %teaminfo_size_red% -> 3
  # ----------------------------------------------------------
  team_size:
    enable: true
    prefix: 'teaminfo'                    # First part of the placeholder: %teaminfo_..%
    pattern: 'size_<team>'                # <team> is an adaptive variable captured from the placeholder name
    requires_player: false                # Does not need a player to evaluate
    context:
      team: 'scoreboard.getTeam(<team>)'  # Fetches the Team object from the main scoreboard
    variables:
      result: 'team.size'                 # Calls team.getSize() — returns the number of entries
    returns: '{result}'
    fallback: '0'                         # Returned if the team does not exist

  # ----------------------------------------------------------
  # %teaminfo_exists_<team>%
  # Returns true/false depending on whether the team exists.
  # Ex: %teaminfo_exists_red% -> true
  # ----------------------------------------------------------
  team_exists:
    enable: true
    prefix: 'teaminfo'
    pattern: 'exists_<team>'
    requires_player: false
    context:
      team: 'scoreboard.getTeam(<team>)'  # If the team does not exist, getTeam() returns null
    variables:
      result: 'team.name'                 # Accessed only to verify the team object is not null
    returns: 'true'                       # If we reach this point, the team exists
    fallback: 'false'                     # Returned if the team is null (does not exist)

  # ----------------------------------------------------------
  # %myteam_size%
  # Returns the team size of the player evaluating the placeholder.
  # ----------------------------------------------------------
  my_team_size:
    enable: true
    prefix: 'myteam'
    pattern: 'size'
    requires_player: true                       # Needs a player to evaluate
    context:
      team: 'scoreboard.getPlayerTeam(player)'  # Fetches the team the player belongs to
    variables:
      result: 'team.size'
    returns: '{result}'
    fallback: '0'                               # Returned if the player is not in any team

  # ----------------------------------------------------------
  # %myteam_name%
  # Returns the team name of the player evaluating the placeholder.
  # ----------------------------------------------------------
  my_team_name:
    enable: true
    prefix: 'myteam'
    pattern: 'name'
    requires_player: true
    context:
      team: 'scoreboard.getPlayerTeam(player)'
    variables:
      result: 'team.name'                       # Calls team.getName()
    returns: '{result}'
    fallback: 'none'                            # Returned if the player is not in any team